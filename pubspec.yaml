name: watashi_qr
description: An App that can read and generate barcodes.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.1.3+5

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  provider: ^6.1.5
  collection: ^1.19.1
  url_launcher: ^6.3.2
  dynamic_color: ^1.8.1
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^10.3.8
  intl: ^0.20.2
  fluttertoast: ^9.0.0
  flutter_vector_icons: ^2.0.0
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  barcode: ^2.2.9
  share_plus: ^12.0.1
  flutter_svg: ^2.2.3
  image: ^4.5.4
  barcode_image: ^2.0.3
  mobile_scanner: ^7.1.4
  image_picker: ^1.2.1
  crop_your_image: ^2.0.0
  vibration: ^3.1.5
  audioplayers: ^6.5.1
  objectbox: ^5.1.0
  objectbox_flutter_libs: any
  watashi_locale:
    git:
      url: https://github.com/oniyukai/watashi_locale.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.10.4
  objectbox_generator: any

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: 'ic_launcher'
  ios: true
  image_path: 'assets/appicon.png'

objectbox:
  output_dir: entity