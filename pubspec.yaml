name: watashi_qr
description: A Flutter app for Android and iOS that can read and create barcodes.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.3.0+8

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.6.0
  intl: ^0.20.2
  provider: ^6.1.5
  collection: ^1.19.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

  share_plus: ^13.3.1
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  vibration: ^3.2.1
  audioplayers: ^6.8.1
  fluttertoast: ^10.0.2

  dynamic_color: ^2.1.0
  native_device_orientation: ^2.1.3
  uuid: ^4.6.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1

  flutter_vector_icons: ^2.0.0
  barcode: ^2.2.9
  flutter_svg: ^2.3.0
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.3.0
  image: ^4.12.0
  barcode_image: ^2.0.3
  watashi_locale:
    git:
      url: https://github.com/oniyukai/watashi_locale.git
      ref: main

  mobile_scanner: ^7.4.2
  crop_your_image: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.16.2
  drift_dev: any

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/appicon.png'
  adaptive_icon_background: '#ffffff'
  adaptive_icon_foreground: 'assets/appicon.png'
