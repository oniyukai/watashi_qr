name: watashi_qr
description: "An Barcode Sannner App."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.1.1+3

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.5.3
  provider: ^6.1.2
  url_launcher: ^6.3.1
  dynamic_color: ^1.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  file_picker: ^9.2.3
  intl: ^0.19.0
  fluttertoast: ^8.2.11
  flutter_vector_icons: ^2.0.0
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.1.1
  string_validator: ^1.1.0
  barcode: ^2.2.9
  share_plus: ^11.0.0
  flutter_svg: ^2.0.17
  image: ^4.5.2
  barcode_image: ^2.0.3
  mobile_scanner: ^6.0.10
  image_picker: ^1.1.2
  crop_your_image: ^2.0.0
  vibration: ^3.1.3
  audioplayers: ^6.2.0
  native_device_orientation: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: 'ic_launcher'
  ios: true
  image_path: 'assets/appicon.png'